name: gate
# The trust root (Charter, Art. 8): rebuilds every proof and replays them
# through the independent checker, then runs the same compiled gate a
# pre-commit hook would. A local --no-verify cannot reach this.
on:
  push:
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build kernel and check all proofs
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: kernel
      - name: replay proofs through the independent checker
        working-directory: kernel
        # Re-verifies every proof term against the kernel, independent of
        # elaboration. Toolchains ≥ v4.28 bundle `leanchecker`; older pins use
        # the external lean4checker at the matching tag. If neither works, the job fails — the replay is the
        # point of this workflow, not an optional extra.
        run: |
          if lake env leanchecker Vps 2>/dev/null; then
            echo "bundled leanchecker: proofs replayed"
          else
            ver=$(sed 's|leanprover/lean4:||' lean-toolchain)
            echo "no bundled leanchecker; using external lean4checker @ $ver"
            git clone --depth 1 --branch "$ver" https://github.com/leanprover/lean4checker /tmp/lean4checker
            (cd /tmp/lean4checker && lake build)
            lake env /tmp/lean4checker/.lake/build/bin/lean4checker Vps
          fi
      - name: gate self-test on a denying world
        working-directory: kernel
        run: |
          printf '{ "paths_changed": ["kernel/Vps/Gate.lean"], "records_added": 0 }' > /tmp/facts.json
          if lake exe vps validate /tmp/facts.json; then
            echo "gate failed to deny a governed change"; exit 1
          else
            echo "gate denies as proven"
          fi
